<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Image Slider</title>
  <link rel="stylesheet" href="slide2.css">
</head>
<body>

  <div class="slider">
    <input type="radio" name="radio-btn" id="radio1" >
    <input type="radio" name="radio-btn" id="radio2">
    <input type="radio" name="radio-btn" id="radio3">

    <div class="slides">
        <div class="slide">
            <img src="https://images.ctfassets.net/e8bhhtr91vp3/6JVFniGI5PdJ4BOBc89noq/e1b8bb3b4b80b456700c436e2b0f0b8e/Lipton-website-150dpi-_Desktop_-_Slider_Home-Frame-2.webp?w=2000&h=807&q=60" alt="">
         </div>
         <div class="slide">
           <img src="https://images.ctfassets.net/e8bhhtr91vp3/6RxltWN3Xp4ORhHc2godhw/2df78a2ed6593bedfc928dbe10cf1326/Lipton-website-150dpi-_Desktop_-_Slider_Home-Frame-3.webp?w=2000&h=806&q=60" alt="">
         </div>
         <div class="slide">
         <img src="https://images.ctfassets.net/e8bhhtr91vp3/1MkHYUP1kMPbJgp7SX7Ghu/25d580b6dcc82fa3916fc8c4f1b77c34/Lipton-website-150dpi-_Desktop_-_Slider_Home-Frame-4.webp?w=2000&h=806&q=60" alt="">
         </div>
    </div>
         
    
    <div class="navigation-dots">
      <label for="radio1" class="dot"></label>
      <label for="radio2" class="dot"></label>
      <label for="radio3" class="dot"></label>
    </div> </div>

</body>
</html>
